<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>KitBench orders (owner only)</title>
<style>
body{font-family:Arial,sans-serif;margin:0;padding:16px;background:#0f1f1c;color:#eaf3f0}
input,select,button{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid #567;background:#18302b;color:inherit}
button{cursor:pointer;background:#58d6bd;color:#06231e;border:0;font-weight:bold}
.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:760px;margin-top:14px}
th,td{border:1px solid #2c4a43;padding:8px;text-align:left;vertical-align:top;font-size:14px}th{background:#18302b}
#msg{margin-top:10px;color:#ffd58a}
</style></head><body>
<h1>KitBench orders</h1>
<p>Owner only. Type your <b>ADMIN_API_TOKEN</b> (from Render) to see orders. It is not saved anywhere.</p>
<input id="tok" type="password" placeholder="Admin token" size="34"> <button id="go">Load orders</button>
<div id="msg"></div><div class="wrap"><table id="t" hidden><thead><tr><th>Order</th><th>When</th><th>Customer</th><th>Address</th><th>Kits</th><th>Total</th><th>Payment</th><th>Status</th></tr></thead><tbody></tbody></table></div>
<script>
var API="https://kitbench-api.onrender.com",msg=document.getElementById("msg"),tb=document.querySelector("tbody");
function esc(s){var d=document.createElement("div");d.textContent=String(s==null?"":s);return d.innerHTML}
async function call(path,opt){opt=opt||{};opt.headers=Object.assign({"x-admin-token":document.getElementById("tok").value.trim(),"Content-Type":"application/json"},opt.headers||{});
 for(var i=0;i<3;i++){var r=await fetch(API+path,opt),t=await r.text();try{return {ok:r.ok,d:JSON.parse(t)}}catch(e){if(i<2)await new Promise(function(k){setTimeout(k,8000)})}}throw new Error("Server is waking up. Wait a minute and try again.")}
async function load(){msg.textContent="Loading… (the first load can take a minute)";try{var r=await call("/api/admin/orders");if(!r.ok)throw new Error(r.d.error||"Could not load");
 tb.innerHTML=r.d.orders.map(function(o){var st=["New","Confirmed","Shipped","Delivered","Cancelled"].map(function(s){return "<option"+(s===o.status?" selected":"")+">"+s+"</option>"}).join("");
  return "<tr><td>"+esc(o.ref)+"</td><td>"+esc(o.created_at)+"</td><td>"+esc(o.name)+"<br>"+esc(o.phone)+"<br>"+esc(o.email)+"</td><td>"+esc(o.address)+"</td><td>"+o.items.map(function(i){return esc(i.title)+" ×"+esc(i.quantity)}).join("<br>")+"</td><td>₹"+(o.total_paise/100)+"</td><td>"+esc(o.payment_method)+"</td><td><select data-id=\""+o.id+"\">"+st+"</select></td></tr>"}).join("");
 document.getElementById("t").hidden=false;msg.textContent=r.d.orders.length+" order(s)."}catch(e){msg.textContent=e.message}}
document.getElementById("go").onclick=load;
tb.onchange=async function(e){var s=e.target;if(!s.dataset.id)return;try{var r=await call("/api/admin/orders/"+s.dataset.id,{method:"PATCH",body:JSON.stringify({status:s.value})});msg.textContent=r.ok?"Status updated.":(r.d.error||"Could not update")}catch(x){msg.textContent=x.message}};
</script></body></html>
